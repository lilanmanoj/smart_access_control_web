openapi: 3.1.0

info:
  title: Smart Access Control — Device API
  version: 1.5.0
  summary: The contract between an ESP32-S3 access panel and the backend.
  description: |
    Every path here is appended directly to the device's configured
    `api_base_url`, which already carries the version prefix:

        https://example.com/api/v1  +  /health

    ### Constraints this contract is shaped by

    These come from the shipped firmware and are not negotiable:

    * **The keypad is a 4x3 matrix — digits, `*` and `#`.** There is no way to
      type a letter, so every code the backend issues is six *digits*. An
      alphanumeric code is physically unenterable at the door.
    * **The device has no real-time clock.** Its clock reads 1970 until NTP
      lands. The server assigns every authoritative timestamp; a device-supplied
      wall clock is never trusted. `uptime_ms` orders events within one batch
      and nothing more.
    * **Fingerprint templates live in the sensor's own flash.** Slot ids are
      device-local integers `0 … capacity-1` and survive reboots and reflashes.
      The backend records who owns a slot. Since 1.1.0 it also receives a copy
      of each template at enrolment, and since 1.2.0 it pushes templates back
      (`GET /fingerprint-templates`), so slot numbers are assigned **per
      device** — the same member may sit in slot 7 on one panel and slot 2 on
      another.
    * **The device must keep working while offline.** Events are queued in
      flash and flushed on reconnect, so this API accepts batched, replayed
      submissions with an idempotency key.
    * **Phone numbers are capped at 14 characters** in device storage. Numbers
      are normalised to E.164 server-side and anything that will not fit is
      refused.

    ### Two contract changes from the original design

    1. `POST /otp-requests` **no longer returns the code.** It returns an
       `otp_request_id`; the backend delivers the code over SMS and e-mail, and
       the device submits what the user typed to `POST /otp-verifications`.
       Under the old shape, anyone holding a device credential could request a
       code for any phone number and read it straight out of the response.
    2. `POST /access-events` is new and is the core of the system. A fingerprint
       match previously opened the door and logged only to the device's serial
       console.

    ### Additions in 1.1.0 (backwards compatible)

    * `POST /enrollments` accepts an **optional** `fingerprint_template`: the
      raw template the panel read back out of its sensor right after storing
      it, with its SHA-256. It is the groundwork for server-side template sync
      (restoring approved members' templates onto a panel). Panels send it
      when the read-back succeeded and omit it otherwise; older panels never
      send it. The response gains `template_status` so the panel can log what
      the backend did with it.
    * If the backend answers `422` to a request carrying a template, the panel
      retries once **without** it — so a backend that rejects the template can
      never cost a member their enrolment.

    ### Additions in 1.2.0 (backwards compatible)

    * `GET /fingerprint-templates` — **template sync.** The authoritative, paged
      list of templates this panel's sensor should hold, one entry per slot,
      capped at the panel's capacity. The panel calls it on every start-up
      (once WiFi is up and `/health` passes) and then every `tpl_sync_hours`
      (a panel setting, default 3). It writes what it is missing, leaves
      identical templates alone, and **deletes every slot the response does not
      list**. Removing a member from a door therefore means: stop listing them.
    * `POST /fingerprint-template-syncs` — the panel's report of what a sync
      actually did, including the slots present on the sensor afterwards.
    * Slot numbers become per-device assignments the backend owns (see the
      sync endpoint). Every lookup of `(device, fingerprint_slot) → member` —
      access events, `/authentications`, enrolments — must go through them.

    ### Changed in 1.3.0: backup codes are a synced set

    * `GET /backup-codes` returns the device's **current** set, and the same
      set on every call. It mints a new set only when the device has no
      current one: first contact, or the previous set was retired because a
      code was accepted. It no longer rotates on every call, so a panel reboot
      no longer changes the codes.
    * An administrator's rotation in the portal makes a new current set. The
      panel collects it at its next sync: at start-up, then every
      `tpl_sync_hours` alongside the template sync, and on its own retry timer.
    * Requires the backend to keep the current set's plaintext (encrypted at
      rest) until the set is superseded or retired. Firmware that polls this
      endpoint must not be deployed against a pre-1.3.0 backend, which would
      rotate the set on every poll.

    ### Additions in 1.4.0 (backwards compatible): the MQTT doorbell

    A panel can now be told to fetch its commands at once instead of at its
    next `/health` poll. Everything below is optional for a panel: one that
    ignores it keeps working exactly as on 1.3.0.

    * **The doorbell.** `POST /device-registrations` returns a `realtime`
      object (when the backend has it switched on) with a broker login for
      this panel. The panel keeps one MQTT connection to that broker and
      subscribes to its own topic. Whenever the backend queues a command for
      the panel it publishes a tiny message there; the panel then calls
      `GET /device-commands`. See **The MQTT doorbell** below.
    * **Commands carry their lifetime.** Every command object has
      `expires_in` (whole seconds left when the response was produced) and
      `expires_at`. Decide expiry with `expires_in`, measured on the panel's
      own uptime clock from when the response arrived; `expires_at` is
      informational, because the panel's wall clock is only as good as the
      last `server_time` it saw.
    * **An unlock is delivered at most once**, across `/health` and
      `/device-commands` together, and lives 60 seconds. Every other command is
      offered again on every poll until it is acknowledged. Unlocks are listed
      first.
    * **`sync_templates`** — a new command: run one template-sync pass now.
      Queued whenever something changes what panels should hold (a member
      suspended, reactivated, approved or deleted; an enrolment made or
      revoked), so the change reaches the sensor in seconds. A revoke no
      longer queues `delete_enrollment`, which is **deprecated**.
    * **Acknowledgements are idempotent.** The first final acknowledgement of
      a command wins; repeats answer the same 200 and change nothing, so a
      panel may retry freely. Result shapes and error codes are listed on the
      acknowledgement endpoint.
    * **Remote unlock is logged on acknowledgement.** The backend records the
      access event when the panel acknowledges `{"opened": true}`; the panel
      sends no `/access-events` entry for a remote unlock.
    * **Size guarantees.** A `/health` or `/device-commands` body is never
      larger than 4096 bytes: commands that would not fit wait for the next
      poll. A command's `payload` is at most 256 bytes encoded.
    * **Rate limits answer with `Retry-After`** (seconds) on every device
      route, alongside `X-RateLimit-Limit` and `X-RateLimit-Remaining`.
      `GET /device-commands` is limited to 30 per minute and
      `POST /device-registrations` to 10 per hour, per device.
    * **`/health` reports the doorbell:** `mqtt=1|0` and `mqtt_reconnects`.
    * **No sensor yet?** Leave `template_capacity` and `enrolled_count` out of
      `POST /device-registrations` (or send `null`); the stored values stand.
      A `0` is refused there, and ignored on `/health`.

    ### The MQTT doorbell

    The doorbell carries **no data and no authority**. A message on the topic
    means only "fetch your commands now"; the command itself is always fetched
    and acknowledged over this authenticated HTTPS API. A forged, replayed or
    lost doorbell can therefore at most cause, or miss, one extra poll, and
    with the broker unreachable every command still arrives through `/health`.

    | | |
    |---|---|
    | Transport | MQTT 3.1.1 or 5 over plain TCP, `host`:`port` from the `realtime` object (1883 by default). |
    | Login | `username`, `password` and `client_id` from the `realtime` object, used verbatim. The broker accepts the login only with that exact client id. |
    | Subscription | `topic` from the `realtime` object, QoS 0, clean session. It is the only topic the login may subscribe to; it may publish nothing. |
    | Message | Any message on the topic means "call `GET /device-commands` now". The payload is currently `{"v":1}` and should be ignored; it is never longer than 256 bytes and never retained. |
    | Keepalive | `keepalive` seconds from the `realtime` object (60). |

    Rules for the panel:

    1. **Fetch once after every successful (re)subscribe.** Doorbells published
       while the panel was disconnected are not queued for it.
    2. **Merge doorbells.** At most one fetch in flight and at most one every
       few seconds; a burst of doorbells needs only one fetch.
    3. **A new password with every registration.** Each
       `POST /device-registrations` issues a fresh password and the previous
       one stops working at once: the broker disconnects any session still
       using it. Reconnect with the new login straight after registering.
    4. **Login refused** (bad credentials / not authorised): the login was
       rotated, disabled or lost. Register again — at most once an hour — and
       reconnect with what comes back. Until then, poll `/health` as usual.
    5. **No `realtime` object** in the registration response: the doorbell is
       off or the broker is unreachable. Stay on `/health` polling and look
       again at the next registration.
    6. **One connection per login.** A second connection with the same client
       id takes over the session and the broker closes the first.
    7. **Deactivated or deleted panels** are disconnected and their login is
       disabled. A reactivated panel's existing login works again.

    ### Additions in 1.5.0 (backwards compatible): the door's timezone

    * `GET /health` carries `timezone`: the door's IANA timezone name and its
      UTC offset, in seconds, at the instant of `server_time`. The panel's
      local time is `server_time` + `utc_offset_seconds`.
    * It is the device's own timezone, set in the dashboard, or its tenant's
      when the device has none. It is left out when neither is set; the panel
      then stays on UTC.
    * The offset is recomputed for every response, so a daylight-saving change
      or an operator's edit reaches the panel at its next poll. The panel needs
      no timezone database and no daylight-saving rules: it keeps the last
      offset it received, including while offline.
    * **For display only** — the status-bar clock and on-screen times. The
      server still assigns every authoritative timestamp, and access events
      are stamped on receipt as before.

  contact:
    name: Smart Access Control
  license:
    name: Proprietary

servers:
  - url: https://example.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development (docker compose)

security:
  - DeviceId: []
    ApiKey: []
    ApiSecret: []

tags:
  - name: Health
    description: Liveness, heartbeat, clock source and command channel.
  - name: Access
    description: The audit trail — every access decision at every door.
  - name: Enrolment
    description: Registering a person at the panel.
  - name: OTP
    description: One-time passwords.
  - name: Backup codes
    description: The method that keeps working when the network does not.
  - name: Commands
    description: Backend-to-device operations.
  - name: Templates
    description: Fingerprint template sync — the backend pushes templates to panels.

paths:
  # ==========================================================================
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe, heartbeat, clock and queued commands
      description: |
        Polled every 30 seconds while the panel is up and every 10 while it
        thinks it is down, which makes it the one call guaranteed to happen.
        Three things ride along on it:

        * `server_time` — the device has no RTC, so this is its only route to a
          real clock — and, since 1.5.0, `timezone`, so it can show local
          time;
        * the heartbeat that tells the dashboard a door has gone dark;
        * any queued commands, so revocation and remote unlock work without a
          second endpoint.

        The firmware requires **both** a 200 and `"status": "ok"` exactly.
        Extra fields are ignored by older builds.

        **Commands (1.4.0).** The same commands `GET /device-commands` serves,
        through the same collection: an unlock handed out here is never handed
        out there, and vice versa. Unlocks first, then the rest in queue
        order, at most 10, and never so many that the body exceeds 4096 bytes.
        Run what this response delivers; there is no need to fetch
        `/device-commands` for it.
      parameters:
        - { $ref: '#/components/parameters/FirmwareVersion' }
        - { $ref: '#/components/parameters/UptimeMs' }
        - { $ref: '#/components/parameters/EnrolledCount' }
        - { $ref: '#/components/parameters/TemplateCapacity' }
        - { $ref: '#/components/parameters/MqttConnected' }
        - { $ref: '#/components/parameters/MqttReconnects' }
      responses:
        '200':
          description: The backend is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, server_time]
                properties:
                  status:
                    type: string
                    const: ok
                    description: The firmware checks for this exact value.
                  server_time:
                    type: string
                    format: date-time
                    examples: ['2026-09-06T10:15:00Z']
                  timezone:
                    $ref: '#/components/schemas/DeviceTimezone'
                  device:
                    $ref: '#/components/schemas/DeviceIdentity'
                  commands:
                    type: array
                    description: Queued commands, collected by this poll.
                    maxItems: 10
                    items: { $ref: '#/components/schemas/Command' }
              example:
                status: ok
                server_time: '2026-11-27T21:10:07Z'
                timezone: { name: Asia/Colombo, utc_offset_seconds: 19800 }
                device: { id: 01a21ed7-2b15-70b5-bfdf-f6ef0618aca8, device_id: SMA_7001, name: Front Door }
                commands:
                  - { id: 01a21ed8-0ff3-7018-9eed-13b3753dc6b6, type: unlock, payload: {}, expires_at: '2026-11-27T21:11:06Z', expires_in: 59 }
                  - { id: 01a21ed8-0982-701f-b2b0-1e51d42d3aaf, type: sync_templates, payload: {}, expires_at: '2026-11-27T21:40:04Z', expires_in: 1797 }
                  - { id: 01a21ed8-0b9b-70e1-b494-21f89cf73add, type: refresh_backup_codes, payload: {}, expires_at: '2026-11-27T21:15:04Z', expires_in: 297 }
                  - { id: 01a21ed8-0dea-7016-a739-f9679accf161, type: report_inventory, payload: {}, expires_at: '2026-11-27T22:10:05Z', expires_in: 3598 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  /access-events:
    post:
      tags: [Access]
      operationId: recordAccessEvents
      summary: Record one access decision, or a batch flushed from the queue
      description: |
        **The most important endpoint in the system.** Every access decision at
        the door arrives here — a fingerprint grant or denial at the main
        screen, an OTP result, a backup-code result, an admin-auth result.

        `idempotency_key` is device-generated and unique per device. An offline
        panel resends its queue, sometimes more than once; replays are silently
        deduplicated and reported in `duplicates` rather than treated as
        errors.

        `occurred_at` is assigned by the server on receipt. `uptime_ms` orders
        events inside one batch and is never treated as a wall clock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                device_id:
                  $ref: '#/components/schemas/DeviceIdClaim'
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/AccessEventSubmission' }
            examples:
              offlineFlush:
                summary: A panel flushing two queued events after reconnecting
                value:
                  device_id: SMA_4821
                  events:
                    - idempotency_key: SMA_4821-000000123
                      method: fingerprint
                      result: granted
                      reason: matched
                      fingerprint_slot: 7
                      confidence: 142
                      uptime_ms: 1234567
                    - idempotency_key: SMA_4821-000000124
                      method: backup_code
                      result: denied
                      reason: code_invalid
                      uptime_ms: 1240000
      responses:
        '202':
          description: Accepted. Duplicates are a success, not an error.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted: { type: integer, examples: [1] }
                  duplicates:
                    type: integer
                    description: Replayed or suppressed rows.
                    examples: [1]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  /authentications:
    post:
      tags: [Access]
      operationId: authenticateAdministrator
      summary: The Admin Settings gate
      description: |
        Asks whether a matched fingerprint belongs to an administrator, before
        the panel exposes its own configuration portal. This is not a way
        through the door.

        `is_admin` is `true` only when the slot belongs, through this
        device's slot assignments, to a member marked as a device
        administrator who may use this door now: not suspended, approved
        where the tenant requires approval, and inside any access schedule.
        It is `false` for everyone else, including an unassigned slot.

        A credential the backend does not accept is a `401`; a device that is
        not active, or a suspended tenant, is a `403` (see the shared
        `Forbidden` response for the codes).

        Every answered call is written to the access log with
        `method: admin_auth`, granted or not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_id]
              properties:
                device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
                enrollment_id:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: |
                    Named `enrollment_id` by the firmware, but it carries the
                    **device-local fingerprint slot**, not a member or
                    enrolment id.
                  examples: [12]
      responses:
        '200':
          description: |
            The decision. Always 200 — "not an administrator" is an answer, not
            a transport failure.
          content:
            application/json:
              schema:
                type: object
                required: [is_admin]
                properties:
                  is_admin: { type: boolean }
                  member:
                    type: object
                    description: Present only when `is_admin` is true.
                    properties:
                      member_id: { type: string, format: uuid }
                      full_name: { type: string, examples: ['Jane Doe'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==========================================================================
  /enrollments:
    post:
      tags: [Enrolment]
      operationId: createEnrollment
      summary: Begin an enrolment from a freshly stored template
      description: |
        The panel writes a template into its sensor's flash and reports which
        slot it used. The member is created without a phone number; the device
        captures that on the next screen, so the enrolment is `pending` until
        then.

        `fingerprint_slot` may be null: the user skipped the finger, or
        registration failed and the template was rolled back.

        `fingerprint_template` is optional (since 1.1.0) and only ever sent
        together with a non-null `fingerprint_slot` — it is the template stored
        in that slot. A template problem must **never** fail the enrolment:
        store the enrolment, discard the bad template, and say so in
        `template_status`. See the `FingerprintTemplate` schema for the
        validation rules.

        **Naming:** the firmware currently calls the returned id `user_id`.
        Here it is `member_id` — `user` means a dashboard operator.

        **Slot assignment (1.2.0):** the slot is the panel's own choice — it
        always enrols into a slot that is empty on its sensor — so it is
        authoritative. Record it as this member's slot assignment on this
        device. If the backend had already assigned that slot on this device to
        a different member whose template the panel has not received yet,
        move that member to another free slot and change the device's sync
        revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
                fingerprint_slot:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 65535
                  examples: [7]
                fingerprint_template:
                  $ref: '#/components/schemas/FingerprintTemplate'
            examples:
              withTemplate:
                summary: Finger stored in slot 7, template read back (firmware 1.1+)
                description: |
                  `data` here is 512 synthetic bytes, not a real fingerprint;
                  its `sha256` is correct, so it doubles as a test fixture.
                value:
                  device_id: SMA_4821
                  fingerprint_slot: 7
                  fingerprint_template:
                    format: as608
                    encoding: base64
                    size: 512
                    sha256: 1c7fb1b3a4be3a63e8e9a81e871ff1a1e40c237f773a905bb5f5cd91e604a87f
                    data: 
              withoutTemplate:
                summary: Finger stored, but the template read-back failed (or older firmware)
                value:
                  device_id: SMA_4821
                  fingerprint_slot: 7
              noFinger:
                summary: The user skipped the finger; phone number follows
                value:
                  device_id: SMA_4821
                  fingerprint_slot: null
      responses:
        '201':
          description: Enrolment started.
          content:
            application/json:
              schema:
                type: object
                required: [member_id, enrollment_id, status]
                properties:
                  member_id: { type: string, format: uuid }
                  enrollment_id: { type: string, format: uuid }
                  status: { type: string, const: pending }
                  template_status:
                    $ref: '#/components/schemas/TemplateStatus'
                  template_error:
                    type: string
                    description: Present only when `template_status` is `rejected`.
                    enum: [unsupported_format, invalid_encoding, size_mismatch, sha256_mismatch, slot_missing]
              examples:
                templateStored:
                  value:
                    member_id: 3f0c6a52-8a7e-4f3b-9a51-2f1d7c0e9b11
                    enrollment_id: 8d2b1e47-5c3a-4e8f-b0d9-6a4f2c1e7b35
                    status: pending
                    template_status: stored
                templateRejected:
                  summary: Enrolment kept, template discarded (hash did not match)
                  value:
                    member_id: 3f0c6a52-8a7e-4f3b-9a51-2f1d7c0e9b11
                    enrollment_id: 8d2b1e47-5c3a-4e8f-b0d9-6a4f2c1e7b35
                    status: pending
                    template_status: rejected
                    template_error: sha256_mismatch
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /enrollments/{memberId}:
    patch:
      tags: [Enrolment]
      operationId: attachPhoneToEnrollment
      summary: Attach the captured phone number, activating the enrolment
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The `member_id` returned by `POST /enrollments`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
                phone:
                  type: string
                  description: |
                    Normalised to E.164 server-side. Send what was typed;
                    the keypad has no `+`, so all of these are the same
                    number: `0771234567`, `94771234567`, `940771234567`,
                    `0094771234567`, `*94771234567`, and `+94771234567`. A
                    leading `*` or `#` and a trailing `#` are ignored. Refused
                    if the normalised form exceeds the 14 characters the panel
                    can store.
                  examples: ['0771234567', '+94771234567']
                fingerprint_slot:
                  type: [integer, 'null']
                  examples: [7]
      responses:
        '200':
          description: Enrolment activated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_id: { type: string, format: uuid }
                  enrollment_id: { type: string, format: uuid }
                  status: { type: string, const: active }
        '404':
          description: No such member in this device's tenant.
        '409':
          description: That phone number already belongs to another member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The number is malformed, or will not fit on the device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==========================================================================
  /otp-requests:
    post:
      tags: [OTP]
      operationId: requestOtp
      summary: Issue a one-time password for a phone number
      description: |
        **The response never contains the code.** The backend delivers it over
        SMS and e-mail and the device submits what the user typed to
        `POST /otp-verifications`.

        `valid: false` means the number is not known to this device's tenant;
        the panel shows "Phone number not found" and lets the user retry. A
        suspended member gives exactly the same answer as an unknown number —
        a door is not a place to enumerate people.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
                phone:
                  type: string
                  description: |
                    What the user typed. Normalised exactly as for
                    enrolment, so a number typed without a plus — `94…`,
                    `940…`, `0…`, or with `*` where the plus would go — finds
                    a member saved from the dashboard as `+94…`. A number
                    that cannot be read gets `valid: false`, like an unknown
                    one, and is logged as a `not_enrolled` denial with
                    `metadata.phone_unrecognised`.
                  examples: ['0771234567', '94771234567']
      responses:
        '200':
          description: The outcome of the lookup.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Issued
                    required: [valid, otp_request_id, expires_in]
                    properties:
                      valid: { type: boolean, const: true }
                      otp_request_id: { type: string, format: uuid }
                      expires_in:
                        type: integer
                        description: Seconds until the code expires.
                        examples: [90]
                      otp:
                        type: string
                        pattern: '^\d{6}$'
                        description: |
                          **Legacy compatibility only**, present when
                          `access.otp.return_code_to_device` is enabled. This
                          hands the plaintext code to anyone holding the device
                          credential and is off by default.
                  - type: object
                    title: Not found
                    required: [valid]
                    properties:
                      valid: { type: boolean, const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /otp-verifications:
    post:
      tags: [OTP]
      operationId: verifyOtp
      summary: Verify the code the user typed
      description: |
        Always 200 — a wrong code is an answer, not a transport failure, and
        the panel branches on `verified`. Every outcome is written to the
        access log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_request_id, code]
              properties:
                device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
                otp_request_id: { type: string, format: uuid }
                code:
                  type: string
                  pattern: '^\d{6}$'
                  examples: ['482915']
      responses:
        '200':
          description: The verification decision.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Verified
                    properties:
                      verified: { type: boolean, const: true }
                      member_id: { type: string, format: uuid }
                      event_id: { type: string, format: uuid }
                  - type: object
                    title: Refused
                    properties:
                      verified: { type: boolean, const: false }
                      reason:
                        type: string
                        enum: [otp_mismatch, otp_expired, member_suspended, pending_approval, outside_schedule]
                      attempts_left: { type: integer, examples: [2] }
        '429': { $ref: '#/components/responses/RateLimited' }

  /otp-deliveries:
    post:
      tags: [OTP]
      operationId: requestOtpDelivery
      summary: Legacy fan-out hook (accepted and discarded)
      deprecated: true
      description: |
        Under the original contract the device held the plaintext code and
        asked the backend to e-mail it. The backend now issues, delivers and
        verifies the code itself, so there is nothing left for this call to do.

        It is kept, and kept fire-and-forget, because shipped firmware calls it
        and ignores the response — a 404 would be logged as a backend failure.
        It never re-sends a code supplied by the caller.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
                phone: { type: string }
                otp: { type: string }
      responses:
        '202':
          description: Accepted and discarded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: array, items: { type: string } }
                  note: { type: string }

  # ==========================================================================
  /backup-codes:
    get:
      tags: [Backup codes]
      operationId: fetchBackupCodes
      summary: Fetch the device's current set of five codes
      description: |
        **Exactly five codes, exactly six numeric digits each.** The firmware
        validates both and rejects the whole set otherwise. A rejected or failed
        fetch keeps the set the panel already holds.

        **Idempotent since 1.3.0.** Returns the device's current set, the same
        `set_id`, codes and original `issued_at` on every call, until that set
        is retired (a code was accepted, reported through
        `POST /backup-codes/attempts`) or superseded (an administrator rotated
        it in the portal, or the optional age-based rotation did). A new set is
        minted only when the device has no current set. The backend therefore
        keeps the current set's plaintext, encrypted at rest, and discards it
        once the set is superseded or retired. Only an authenticated, active
        device receives it.

        The panel calls this when it first comes online after boot, every
        `tpl_sync_hours` alongside the fingerprint template sync, on a 15-minute
        retry after a failure, right after a code is accepted, and when the
        backup screen opens with no set held. Each call marks the set as
        collected by the device (first and most recent collection), so the
        portal can show when a rotated set has reached the door.

        A panel offline across a rotation keeps the superseded set until its
        next successful sync. Those codes come back as `code_expired` rather
        than `code_invalid`.
      responses:
        '200':
          description: The current set.
          content:
            application/json:
              schema:
                type: object
                required: [set_id, codes, issued_at]
                properties:
                  set_id: { type: string, format: uuid }
                  codes:
                    type: array
                    minItems: 5
                    maxItems: 5
                    items: { type: string, pattern: '^\d{6}$' }
                    examples:
                      - ['482915', '730264', '915738', '204681', '657390']
                  issued_at: { type: string, format: date-time }
        '409':
          description: |
            This tenant is in the online-only posture: the panel caches nothing
            and must verify through `POST /backup-code-verifications`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /backup-codes/attempts:
    post:
      tags: [Backup codes]
      operationId: recordBackupCodeAttempt
      summary: Log one entry attempt
      description: |
        Rate-limited per device. Repeated failures against a static six-digit
        secret are the clearest brute-force signal the system has; crossing the
        threshold raises an alert and emits a realtime event.

        The panel reports what it decided locally in `accepted`, and the
        backend reaches its own conclusion (returned for information; the
        panel's own decision stands). A disagreement means the panel is running on a
        set the backend has superseded; it is written to the audit log
        (`backup_code.decision_mismatch`) rather than quietly reconciled.

        **Logging.** A panel that sends `accepted` must also report the
        attempt through `POST /access-events` (which it queues while
        offline); that report is the access-log row, so this call writes
        none. Without `accepted`, this call writes the row itself.

        **A used code.** A correct code retires its whole set, and nothing
        more: the next `GET /backup-codes` mints the following set, with reason
        `after_use`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
                code: { type: string, pattern: '^\d{6}$' }
                accepted:
                  type: boolean
                  description: What the panel decided locally.
      responses:
        '200':
          description: Logged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged: { type: boolean, const: true }
                  accepted: { type: boolean }
                  reason:
                    type: string
                    enum: [code_accepted, code_invalid, code_expired]
        '429': { $ref: '#/components/responses/RateLimited' }

  /backup-code-verifications:
    post:
      tags: [Backup codes]
      operationId: verifyBackupCode
      summary: Server-side backup-code verification (online-only posture)
      description: |
        For deployments that accept losing offline operation in exchange for
        not caching plaintext codes on the panel. Backup access stops working
        when the network is down — which, for a *backup* method, may be exactly
        the wrong trade, so it is a per-tenant setting and off by default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: The verification decision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  reason: { type: string }

  # ==========================================================================
  /device-commands:
    get:
      tags: [Commands]
      operationId: collectDeviceCommands
      summary: Collect queued commands
      description: |
        What the panel fetches when its MQTT doorbell rings (1.4.0), and once
        after every successful MQTT (re)subscribe. No query parameters.

        Commands also ride along on the health response, through the same
        collection: an unlock is delivered **at most once** across the two
        endpoints, and every other command is offered again on every poll —
        either endpoint — until it is acknowledged. De-duplicate by `id`.
        Unlocks first, then queue order; at most 10, and never so many that
        the body exceeds 4096 bytes.

        Collecting a command marks it `sent`, not `acked` — until the device
        confirms, the backend does not claim the door opened.

        Limited to 30 requests per minute per device; a 429 carries
        `Retry-After`.
      responses:
        '200':
          description: Outstanding commands.
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    maxItems: 10
                    items: { $ref: '#/components/schemas/Command' }
              example:
                commands:
                  - { id: 01a21ed8-0982-701f-b2b0-1e51d42d3aaf, type: sync_templates, payload: {}, expires_at: '2026-11-27T21:40:04Z', expires_in: 1797 }
                  - { id: 01a21ed8-0b9b-70e1-b494-21f89cf73add, type: refresh_backup_codes, payload: {}, expires_at: '2026-11-27T21:15:04Z', expires_in: 297 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /device-commands/{commandId}/acknowledgements:
    post:
      tags: [Commands]
      operationId: acknowledgeDeviceCommand
      summary: Confirm a command was carried out
      description: |
        Every command the panel receives gets exactly one final answer here:
        `acked` when it was carried out, `failed` (with `result.error`) when it
        was not — including types the panel does not support.

        **Idempotent (1.4.0).** The first final acknowledgement wins and runs
        its effects (logging a remote unlock, reconciling an inventory). A
        repeat — a retry after a timeout, or a re-offered command answered
        again — returns the same 200 and changes nothing. An acknowledgement
        that arrives after the command expired is still accepted: an unlock
        acknowledged late did open the door.

        | `type` | `acked` result | `failed` `result.error` |
        |---|---|---|
        | `unlock` | `{"opened": true}` — the backend writes the access event (`method: remote`) now. | `busy` (the lock was not energised), `expired`, `unsupported` |
        | `sync_templates` | `{"status": "unchanged"}` or `{"status": "complete" \| "partial", "written": n, "deleted": n}` — after the pass finishes | `sync_failed`, `not_idle`, `sensor_unavailable` |
        | `delete_enrollment` (deprecated) | `{"deleted": true, "via": "sync_templates"}` | `still_listed`, `sync_failed`, `sensor_error`, `sensor_unavailable`, `invalid_payload` |
        | `refresh_backup_codes` | `{"refreshed": true}` — after the fetch | `fetch_failed` |
        | `report_inventory` | `{"occupied_slots": [0, 1, 4, 7]}` — up to 1024 entries | `sensor_unavailable` |
        | anything else | — | `unsupported` |

        Any command may also fail with `out_of_memory`. `result.error` is a
        free string of at most 64 characters, so a panel may send a code not
        listed here; the backend stores it and shows it to operators.
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [acked, failed] }
                result:
                  type: object
                  maxProperties: 20
                  description: |
                    Per type, as in the table above. A `report_inventory`
                    acknowledgement carries `occupied_slots`, which the backend
                    reconciles against its own records.
                  properties:
                    error: { type: string, maxLength: 64 }
                    occupied_slots:
                      type: array
                      maxItems: 1024
                      items: { type: integer, minimum: 0, maximum: 65535 }
                  additionalProperties: true
                  examples:
                    - { opened: true }
                    - { status: complete, written: 2, deleted: 1 }
                    - { occupied_slots: [0, 1, 4, 7] }
                    - { error: busy }
      responses:
        '200':
          description: Acknowledged — the first time, or again (no effect).
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No such command for this device. Final: do not retry.
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ==========================================================================
  /device-registrations:
    post:
      tags: [Health]
      operationId: registerDevice
      summary: Report identity, firmware version and capacity on first contact
      description: |
        Lets the dashboard adopt a panel rather than requiring an installer to
        type credentials into a device blind.

        This still requires a valid credential: registration tells the backend
        *about* a device it already trusts, it does not create trust.
        Self-service enrolment of unknown hardware is not something an access
        control system should offer.

        **Safe to call again** (1.4.0) — once per boot, and once more whenever
        the MQTT broker refuses the panel's login (at most once an hour). It
        updates only the fields sent and `last_seen_at`, and issues a new
        MQTT password; it writes no audit entry, queues no command and moves
        no slot. Limited to 10 per hour per device.

        **No sensor detected?** Leave `template_capacity` and `enrolled_count`
        out, or send `null`; the stored values stand. Sending a capacity
        changes the panel's template set, so send the sensor's real value once
        it has answered.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firmware_version: { type: string, maxLength: 32, examples: ['1.4.0'] }
                template_capacity:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 1000
                  description: Omit (or null) until the sensor has reported it.
                  examples: [200]
                enrolled_count:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 1000
                  description: Omit (or null) until the sensor has reported it.
                  examples: [12]
                metadata: { type: object, maxProperties: 20, additionalProperties: true }
      responses:
        '201':
          description: |
            Registered. Sent with `Cache-Control: no-store`: it may carry a
            password.
          content:
            application/json:
              schema:
                type: object
                required: [device, server_time, settings]
                properties:
                  device: { $ref: '#/components/schemas/DeviceIdentity' }
                  server_time: { type: string, format: date-time }
                  settings:
                    type: object
                    properties:
                      otp_ttl_seconds: { type: integer }
                      backup_codes_online_only: { type: boolean }
                  realtime:
                    $ref: '#/components/schemas/RealtimeLogin'
              example:
                device: { id: 01a21ed7-2b15-70b5-bfdf-f6ef0618aca8, device_id: SMA_7001, name: Front Door, location: Lobby, status: active, template_capacity: 200 }
                server_time: '2026-11-27T21:09:15Z'
                settings: { otp_ttl_seconds: 90, backup_codes_online_only: false }
                realtime:
                  protocol: mqtt
                  host: mqtt.example.com
                  port: 1883
                  username: dev-01a21ed7-2b15-70b5-bfdf-f6ef0618aca8
                  password: '<32 characters, shown once>'
                  client_id: 01a21ed7-2b15-70b5-bfdf-f6ef0618aca8
                  topic: sa/v1/dev/01a21ed7-2b15-70b5-bfdf-f6ef0618aca8/notify
                  keepalive: 60
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  /fingerprint-templates:
    get:
      tags: [Templates]
      operationId: listFingerprintTemplates
      summary: The template set this panel should hold (template sync)
      description: |
        Returns the **complete, authoritative** list of what this panel's
        sensor should hold: one entry per slot, ascending by slot, never more
        than `capacity` entries in total. Paged with `offset` / `limit`.

        **When the panel calls it:** on every start-up, as soon as WiFi is up
        and `/health` passes, and then every `tpl_sync_hours` (a panel
        setting, whole hours 1–168, default 3). A failed sync is retried after
        15 minutes. The panel's screen is blocked while a sync runs, so answer
        quickly.

        **What the panel does with the answer:**

        1. For each entry with a `template`: if the sensor slot already holds
           bytes with the same `sha256`, nothing; otherwise it downloads the
           template into that slot (replacing whatever was there) and reads it
           back to verify the hash.
        2. For each entry with `template: null`: nothing. The slot belongs to a
           member, but the backend has no template bytes for it (enrolled with
           pre-1.1 firmware, or the template was rejected). The panel keeps
           whatever its sensor has there and never deletes it.
        3. **Deletes every occupied slot that no entry lists.** It does this
           only after every page arrived, the `revision` stayed the same on
           every page, and every entry was attempted. A broken or partial
           response never deletes anything.
        4. Reports the outcome to `POST /fingerprint-template-syncs`.

        **What to list:** only `active` templates (not `superseded` or
        `deleted`) that belong to a member, are of the requested
        `template_format`, and whose member may use this device. Members whose
        enrolment on **this** device has no stored template go in as
        `template: null`. Anything not listed is deleted from the panel.

        **Slots are per device.** For a member enrolled on this panel, the slot
        is the one it enrolled into. For a member enrolled elsewhere, the
        backend assigns a free slot on this device and keeps that assignment
        stable across syncs. Never move an existing assignment to another slot
        without a reason, because every move costs the panel a delete and a
        write.

        **Never reuse a slot on the same device for a different member until
        the panel has confirmed it empty.** After the backend stops listing
        member A in slot 5, the panel still holds A's finger in slot 5 until
        its next sync. If slot 5 were handed to member B straight away, A's
        finger would be logged as B. A slot becomes reusable only once a sync
        report from that device has `status: completed` or `partial` and its
        `slots_present` does not contain the slot.

        **Revision:** an opaque string that changes whenever anything in this
        device's set changes (an entry added or removed, a slot, member, or
        template sha256 changed, or the capacity or format changed), and is
        identical whenever the set is identical. A hash of the sorted entries
        works well. When `since_revision` equals the current revision, answer
        `unchanged: true` with an empty `templates` array, so a reboot with
        nothing new costs one tiny request.

        **Over capacity:** if more templates qualify than `capacity`, list
        members enrolled on this device first, then the others in a stable
        order of the backend's choosing. Set `truncated: true` and surface it
        on the dashboard.

        **Size:** each template is about 0.9 KB of JSON. The panel has no
        PSRAM and parses one page into a 14 KB buffer, so `limit` is capped
        at 10.

        **Security:** this is the only endpoint that returns template bytes.
        Device credentials only (never a dashboard session); only the
        authenticated device's tenant; `Cache-Control: no-store`; never log
        `data`. Write one audit entry per sync that served templates.
      parameters:
        - name: device_id
          in: query
          required: true
          description: Must equal the authenticated device (`X-Device-Id`); a mismatch is a 403.
          schema: { $ref: '#/components/schemas/DeviceIdClaim' }
        - name: capacity
          in: query
          required: true
          description: |
            How many templates the panel's sensor can hold (slots
            `0 … capacity-1`). `total` must never exceed it and no `slot` may be
            `>= capacity`. The panel aborts the sync, deleting nothing, if
            either happens.
          schema: { type: integer, minimum: 1, maximum: 1024, examples: [300] }
        - name: template_format
          in: query
          required: true
          description: Only templates of this format are listed. Unknown format → 422.
          schema: { type: string, enum: [as608] }
        - name: offset
          in: query
          required: false
          description: Entries to skip, in slot order. The panel walks the pages `0, limit, 2·limit, …`.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          description: Page size. The panel sends 8.
          schema: { type: integer, minimum: 1, maximum: 10, default: 8 }
        - name: since_revision
          in: query
          required: false
          description: |
            The revision the panel last applied completely. The panel omits it
            after a failed or partial sync, or when its sensor's template count
            or capacity no longer matches what it had after that sync (for
            example, a wiped or replaced sensor).
          schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
        - { $ref: '#/components/parameters/EnrolledCount' }
        - { $ref: '#/components/parameters/FirmwareVersion' }
      responses:
        '200':
          description: One page of this device's template set.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateManifestPage' }
              examples:
                firstPage:
                  summary: Three templates for this panel; one with no stored template
                  description: |
                    `data` is the same 512 synthetic bytes as the enrolment
                    fixture (not a real fingerprint); its `sha256` is correct.
                  value:
                    revision: 9f2c41d07a3be815
                    unchanged: false
                    total: 3
                    offset: 0
                    limit: 8
                    truncated: false
                    templates:
                      - slot: 0
                        member_id: 3f0c6a52-8a7e-4f3b-9a51-2f1d7c0e9b11
                        template:
                          format: as608
                          encoding: base64
                          size: 512
                          sha256: 1c7fb1b3a4be3a63e8e9a81e871ff1a1e40c237f773a905bb5f5cd91e604a87f
                          data: 
                      - slot: 3
                        member_id: 5b7e2d19-0c4f-4a8e-b6d3-9e1f2a7c4d58
                        template: null
                      - slot: 7
                        member_id: 8a1d4f6c-2b3e-4c7a-9f05-1d6e8b2a3c94
                        template:
                          format: as608
                          encoding: base64
                          size: 512
                          sha256: 1c7fb1b3a4be3a63e8e9a81e871ff1a1e40c237f773a905bb5f5cd91e604a87f
                          data: 
                unchanged:
                  summary: since_revision matched — nothing to do
                  value:
                    revision: 9f2c41d07a3be815
                    unchanged: true
                    total: 3
                    offset: 0
                    limit: 8
                    truncated: false
                    templates: []
                empty:
                  summary: Nobody may use this panel — it deletes every template
                  value:
                    revision: e3b0c44298fc1c14
                    unchanged: false
                    total: 0
                    offset: 0
                    limit: 8
                    truncated: false
                    templates: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /fingerprint-template-syncs:
    post:
      tags: [Templates]
      operationId: reportTemplateSync
      summary: Report what a template sync actually did
      description: |
        Sent after every sync that got past the first page, except one that
        `GET /fingerprint-templates` answered with `unchanged: true`.

        * `completed`: every entry applied, unlisted slots deleted.
        * `partial`: the sync ran to the end, but some entries or deletions
          failed (`errors`).
        * `aborted`: stopped early (`abort_reason`). Templates written before
          the stop are on the sensor, but **nothing was deleted**.

        `slots_present` is the sensor's real occupancy after the sync. It is
        present on `completed` / `partial` reports when the panel could read
        it. It is the ground truth the backend uses to confirm a slot is
        empty before reusing it (see `GET /fingerprint-templates`), and to
        flag drift on the dashboard.

        Idempotent from the backend's view: store every report. The panel does
        not retry a failed report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateSyncReport' }
            examples:
              completed:
                value:
                  device_id: SMA_4821
                  revision: 9f2c41d07a3be815
                  status: completed
                  template_format: as608
                  capacity: 300
                  enrolled_count: 3
                  written: 1
                  unchanged: 1
                  deleted: 2
                  retained: 1
                  missing: 0
                  failed: 0
                  duration_ms: 1840
                  firmware_version: 1.0.0
                  errors: []
                  slots_present: [0, 3, 7]
              aborted:
                value:
                  device_id: SMA_4821
                  revision: 9f2c41d07a3be815
                  status: aborted
                  abort_reason: revision_changed
                  template_format: as608
                  capacity: 300
                  enrolled_count: 4
                  written: 1
                  unchanged: 0
                  deleted: 0
                  retained: 0
                  missing: 0
                  failed: 0
                  duration_ms: 950
                  firmware_version: 1.0.0
                  errors: []
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

# ============================================================================
components:
  securitySchemes:
    DeviceId:
      type: apiKey
      in: header
      name: X-Device-Id
      description: |
        The identifier the firmware generates on first boot (`SMA_4821`).
        **Device-asserted**, so the backend treats it as a claim: it is checked
        against the device the credential belongs to and never trusted alone.
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    ApiSecret:
      type: apiKey
      in: header
      name: X-API-Secret
      description: |
        Compared in constant time against a stored digest. Two live credentials
        per device are permitted so a rotation overlaps instead of leaving a
        gap where the panel cannot reach the backend.

  parameters:
    FirmwareVersion:
      name: firmware_version
      in: query
      required: false
      schema: { type: string, maxLength: 32 }
    UptimeMs:
      name: uptime_ms
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    EnrolledCount:
      name: enrolled_count
      in: query
      required: false
      description: Omit until the sensor has reported it; 0 is ignored.
      schema: { type: integer, minimum: 0 }
    TemplateCapacity:
      name: template_capacity
      in: query
      required: false
      description: Omit, or send 0, until the sensor has reported it; 0 is ignored.
      schema: { type: integer, minimum: 0 }
    MqttConnected:
      name: mqtt
      in: query
      required: false
      description: |
        1.4.0. Whether the panel's MQTT doorbell connection is up right now.
        Shown on the dashboard; omit if the panel has no doorbell.
      schema: { type: integer, enum: [0, 1] }
    MqttReconnects:
      name: mqtt_reconnects
      in: query
      required: false
      description: |
        1.4.0. MQTT reconnections since boot. A count that keeps climbing on a
        healthy network is how a contested login shows up.
      schema: { type: integer, minimum: 0 }

  schemas:
    DeviceIdClaim:
      type: string
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      description: |
        Optional echo of the device's own id. If present it must match the
        authenticated device; a mismatch is a 403, because it means either a
        misconfigured panel or a credential being used to write another
        device's history.
      examples: ['SMA_4821']

    FingerprintTemplate:
      type: object
      description: |
        A fingerprint template exactly as the panel's sensor stores it, read
        back over UART immediately after enrolment. Opaque to the backend: it
        is a vendor feature file, not an image, and is only usable by a sensor
        of the same `format`.

        Validation, in order. Any failure discards the template (the enrolment
        itself still succeeds) and is reported as `template_status: rejected`
        with the matching `template_error`:

        0. the sibling `fingerprint_slot` is non-null → else `slot_missing`
        1. `format` is a known value (today only `as608`) → else `unsupported_format`
        2. `encoding` is `base64` and `data` decodes as strict base64 → else `invalid_encoding`
        3. decoded length equals `size`, and `size` is 1–1024 → else `size_mismatch`
        4. lowercase hex SHA-256 of the **decoded bytes** equals `sha256` → else `sha256_mismatch`

        `fingerprint_slot` (the sibling field) says which sensor slot holds it.

        The same object comes back to panels in `GET /fingerprint-templates`,
        byte-for-byte as stored: same `data`, same `sha256`. The panel applies
        the same checks before it writes a template, and skips (and reports)
        any entry that fails them.
      required: [format, encoding, size, sha256, data]
      properties:
        format:
          type: string
          description: Template family. Templates are only interchangeable between sensors of the same format.
          enum: [as608]
          examples: [as608]
        encoding:
          type: string
          enum: [base64]
          examples: [base64]
        size:
          type: integer
          minimum: 1
          maximum: 1024
          description: Length of the decoded template in bytes. 512 on a genuine AS608.
          examples: [512]
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of the decoded template bytes, computed on the panel.
          examples: [1c7fb1b3a4be3a63e8e9a81e871ff1a1e40c237f773a905bb5f5cd91e604a87f]
        data:
          type: string
          contentEncoding: base64
          maxLength: 1368
          description: The template, standard base64 (RFC 4648, with padding). 684 characters for 512 bytes.

    TemplateStatus:
      type: string
      description: |
        What the backend did with `fingerprint_template`:
        `stored` — validated and saved; `absent` — none was sent;
        `rejected` — sent but discarded (see `template_error`).
        The panel only logs this; it never changes the enrolment outcome.
      enum: [stored, absent, rejected]

    TemplateManifestEntry:
      type: object
      description: One slot on this panel and what it must hold.
      required: [slot, member_id, template]
      properties:
        slot:
          type: integer
          minimum: 0
          description: Device-local slot, `< capacity`. Unique within the set.
          examples: [7]
        member_id: { type: string, format: uuid }
        template:
          description: |
            The template to hold in `slot`, or `null` to keep whatever the
            panel already has there (the backend holds no bytes for this
            member's enrolment on this device).
          oneOf:
            - { $ref: '#/components/schemas/FingerprintTemplate' }
            - { type: 'null' }

    TemplateManifestPage:
      type: object
      required: [revision, unchanged, total, offset, limit, truncated, templates]
      properties:
        revision:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: Identifies the whole set (all pages). Must be the same on every page of one sync.
          examples: [9f2c41d07a3be815]
        unchanged:
          type: boolean
          description: True only when the request's `since_revision` equals `revision`. `templates` is then empty.
        total:
          type: integer
          minimum: 0
          description: Entries in the whole set, `<= capacity`.
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 10 }
        truncated:
          type: boolean
          description: More templates qualified than `capacity` allows; the set was cut to fit.
        templates:
          type: array
          maxItems: 10
          description: This page's entries, ascending by `slot`.
          items: { $ref: '#/components/schemas/TemplateManifestEntry' }
        server_time: { type: string, format: date-time }

    TemplateSyncError:
      type: string
      description: |
        Why one entry or deletion could not be applied.
        Entry checks: `invalid_slot` (missing, negative or `>= capacity`;
        reported with slot 65535 when absent), `duplicate_slot`,
        `unsupported_format`, `invalid_encoding`, `size_mismatch`,
        `sha256_mismatch`.
        Sensor: `sensor_not_ready`, `sensor_error` (stopped answering — the
        sync aborts), `download_rejected`, `store_failed`, `verify_failed` (the
        read-back after writing did not hash to `sha256`).
      enum:
        - invalid_slot
        - duplicate_slot
        - unsupported_format
        - invalid_encoding
        - size_mismatch
        - sha256_mismatch
        - sensor_not_ready
        - sensor_error
        - download_rejected
        - store_failed
        - verify_failed

    TemplateSyncReport:
      type: object
      required: [revision, status, capacity, written, unchanged, deleted, failed]
      properties:
        device_id: { $ref: '#/components/schemas/DeviceIdClaim' }
        revision:
          type: string
          description: The revision the sync was applying (from its first page).
        status: { type: string, enum: [completed, partial, aborted] }
        abort_reason:
          type: string
          description: Present only when `status` is `aborted`.
          enum: [http_error, invalid_response, capacity_exceeded, revision_changed, sensor_error, out_of_memory]
        template_format: { type: string, enum: [as608] }
        capacity: { type: integer, minimum: 1 }
        enrolled_count:
          type: integer
          minimum: 0
          description: Templates on the sensor after the sync.
        written: { type: integer, minimum: 0, description: Templates downloaded into the sensor. }
        unchanged: { type: integer, minimum: 0, description: Entries already present with identical bytes. }
        deleted: { type: integer, minimum: 0, description: Unlisted slots removed. }
        retained: { type: integer, minimum: 0, description: 'Entries with `template: null`, left as they were.' }
        missing:
          type: integer
          minimum: 0
          description: 'Of the retained entries, how many slots were empty on the sensor (the member cannot use this door until re-enrolled).'
        failed: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        firmware_version: { type: string, maxLength: 32 }
        errors:
          type: array
          maxItems: 16
          description: The first 16 failures. `failed` has the full count.
          items:
            type: object
            required: [slot, error]
            properties:
              slot: { type: integer, minimum: 0, maximum: 65535 }
              error: { $ref: '#/components/schemas/TemplateSyncError' }
        slots_present:
          type: array
          description: Occupied sensor slots after the sync. Absent on `aborted`, or when the panel could not read them.
          items: { type: integer, minimum: 0 }

    DeviceIdentity:
      type: object
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, examples: ['SMA_4821'] }
        name: { type: string, examples: ['Front Entrance'] }
        location: { type: [string, 'null'] }
        status: { type: string, enum: [provisioned, active, suspended, retired] }
        template_capacity: { type: integer }

    AccessMethod:
      type: string
      enum: [fingerprint, otp, backup_code, admin_auth, remote]
      description: |
        `admin_auth` is not a way through the door — it is the fingerprint
        check that gates the panel's own settings portal.

    AccessReason:
      type: string
      description: Machine-readable outcome code.
      enum:
        # Granted
        - matched
        - otp_verified
        - code_accepted
        - admin_confirmed
        - remote_unlock
        # Denied
        - no_match
        - not_enrolled
        - member_suspended
        # Server-side only: the tenant requires approval (manual §9.2) and
        # this member has not been approved. A panel never sends it.
        - pending_approval
        - otp_expired
        - otp_mismatch
        - code_invalid
        - code_expired
        - not_admin
        - backend_unreachable
        - rate_limited
        - outside_schedule
        - device_suspended
        - duplicate

    AccessEventSubmission:
      type: object
      required: [method, result, reason]
      properties:
        idempotency_key:
          type: [string, 'null']
          maxLength: 128
          description: |
            Device-generated and unique **per device**. Replays are
            deduplicated on it — an offline panel will resend. Two panels
            numbering their own queues from zero do not collide.
          examples: ['SMA_4821-000000123']
        method: { $ref: '#/components/schemas/AccessMethod' }
        result: { type: string, enum: [granted, denied] }
        reason: { $ref: '#/components/schemas/AccessReason' }
        fingerprint_slot:
          type: [integer, 'null']
          minimum: 0
          maximum: 65535
          description: Device-local sensor slot.
        confidence:
          type: [integer, 'null']
          description: AS608 match confidence.
          examples: [142]
        uptime_ms:
          type: [integer, 'null']
          minimum: 0
          description: |
            Milliseconds since the device booted. Orders events **within one
            batch** and nothing more — the device has no trustworthy clock.
        member_uuid:
          type: [string, 'null']
          format: uuid
          description: |
            Rarely needed. The backend normally resolves the member from the
            fingerprint slot itself.
        metadata:
          type: [object, 'null']
          maxProperties: 20
          additionalProperties: true

    Command:
      type: object
      required: [id, type, payload]
      properties:
        id:
          type: string
          format: uuid
          description: Lower-case hex and hyphens, 36 characters. De-duplicate on it.
        type:
          type: string
          maxLength: 31
          description: |
            * `unlock` — open the door for the panel's lock time. Delivered at
              most once; lives 60 s.
            * `sync_templates` (1.4.0) — run one template-sync pass now
              (`GET /fingerprint-templates` + `POST /fingerprint-template-syncs`).
              Lives 30 min. Several arriving before a pass starts may share it.
            * `refresh_backup_codes` — fetch `GET /backup-codes` now.
            * `report_inventory` — report the occupied sensor slots.
            * `delete_enrollment` — **deprecated in 1.4.0** and no longer
              queued; one queued earlier may still arrive within 24 h. Handle it
              with a sync pass, never a direct erase. Payload:
              `fingerprint_slot`.
            * `reboot`, `update_settings` — not queued by the backend today.

            New types may appear; acknowledge an unknown one as `failed` with
            `{"error": "unsupported"}`.
          enum:
            - unlock
            - sync_templates
            - refresh_backup_codes
            - report_inventory
            - delete_enrollment
            - reboot
            - update_settings
        payload:
          type: object
          description: At most 256 bytes encoded. `{}` when the type takes none.
          additionalProperties: true
          examples:
            - {}
            - { fingerprint_slot: 7 }
        expires_in:
          type: integer
          minimum: 0
          description: |
            1.4.0. Whole seconds left when the response was produced. Measure
            it on the panel's own uptime clock from when the response arrived.
        expires_at:
          type: string
          format: date-time
          description: |
            1.4.0. The same deadline as a UTC timestamp. Informational: the
            panel's wall clock may be off by a minute or more.

    DeviceTimezone:
      type: object
      description: |
        1.5.0. The door's timezone, for showing local time. The device's own,
        or its tenant's when the device has none; absent when neither is set
        (stay on UTC). Display only: never use it to stamp an event.
      required: [name, utc_offset_seconds]
      properties:
        name:
          type: string
          maxLength: 64
          description: IANA timezone name.
          examples: [Asia/Colombo, Europe/London]
        utc_offset_seconds:
          type: integer
          minimum: -50400
          maximum: 50400
          description: |
            Seconds east of UTC at the instant of `server_time` (negative west
            of it), daylight saving included. Local time = `server_time` +
            this. May change between polls; always use the latest.
          examples: [19800, 0, -14400]

    RealtimeLogin:
      type: object
      description: |
        1.4.0. This panel's MQTT doorbell login. Present only while the
        backend has the doorbell switched on and could reach the broker. The
        password is new on every registration and appears in this response
        only; the previous one stops working at once. Keep it in memory.
      required: [protocol, host, port, username, password, client_id, topic, keepalive]
      properties:
        protocol: { type: string, enum: [mqtt], description: 'Plain TCP. A future WebSocket fallback would be "ws" and add `path`.' }
        host: { type: string, maxLength: 253, description: A hostname or IP address. }
        port: { type: integer, minimum: 1, maximum: 65535, examples: [1883] }
        username: { type: string, maxLength: 64, description: 'Currently `dev-` and the device UUID: 40 characters.', examples: [dev-01a21ed7-2b15-70b5-bfdf-f6ef0618aca8] }
        password: { type: string, minLength: 16, maxLength: 64, description: Currently 32 letters and digits. }
        client_id: { type: string, maxLength: 64, description: 'Use verbatim; the broker accepts the login with this client id only. Currently the device UUID: 36 characters.' }
        topic: { type: string, maxLength: 128, description: 'The only topic this login may subscribe to. Use verbatim. Currently `sa/v1/dev/<uuid>/notify`: 53 characters.' }
        keepalive: { type: integer, minimum: 10, maximum: 300, description: Seconds. }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: The contract. Branch on this, not on the message.
              examples: ['otp_expired']
            message:
              type: string
              description: For whoever reads the logs afterwards.
            fields:
              type: object
              description: Field-level detail on a validation failure.
              additionalProperties:
                type: array
                items: { type: string }
            retry_after:
              type: integer
              description: Seconds, on a rate-limit response.

  responses:
    Unauthorized:
      description: |
        Bad credentials. Deliberately identical for every failure mode — which
        of the three header values was wrong is not something a caller gets to
        learn by probing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: unauthorized
              message: Invalid device credentials.

    Forbidden:
      description: |
        The credential is valid but the request is not permitted. `code` is
        one of:

        * `device_provisioned` — added in the dashboard but not activated yet.
          Every device route answers this until an operator activates it;
          nothing the panel sends changes it.
        * `device_suspended` — deactivated by an operator.
        * `device_retired` — retired.
        * `tenant_suspended` — the account is suspended.
        * a body naming a different device than the credential.

        A revoked or expired credential is a 401, not a 403.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: device_suspended
              message: This device is not permitted to use the API.

    ValidationFailed:
      description: The payload did not satisfy the contract.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    RateLimited:
      description: |
        Per-device limit exceeded. Keyed on the authenticated device rather
        than the IP: a whole site's panels commonly share one public address,
        and one compromised device must not throttle its neighbours.

        Wait `Retry-After` seconds before trying again (1.4.0); if the header
        is missing, wait 30 seconds.
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: rate_limited
              message: Too Many Attempts.
