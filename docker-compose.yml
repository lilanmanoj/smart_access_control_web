# Smart Access Control — local development stack.
#
# Everything the application needs runs in containers: PHP, MySQL, Redis, the
# Reverb websocket server, the queue worker, the scheduler, the Vite dev server
# and a mail catcher. The host needs Docker and nothing else.
#
#   docker compose up -d --build
#   open http://localhost:8000
#
name: smart-access-control

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: smart-access-control/app:dev
  # Optional, so `docker compose up` works on a bare clone: the dev image is
  # APP_ENV=local, and its entrypoint seeds .env from .env.example and
  # generates an APP_KEY on first boot. Every ${VAR} below has a default for
  # the same reason.
  env_file:
    - path: .env
      required: false
  volumes:
    - .:/var/www/html
    - composer-cache:/tmp/composer
  environment:
    COMPOSER_HOME: /tmp/composer
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Web — nginx + PHP-FPM. This is the only port a reverse proxy needs.
  # ---------------------------------------------------------------------------
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      COMPOSER_HOME: /tmp/composer
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The other roles wait on this rather than on "started": on a fresh clone
    # the app container spends its first minute installing dependencies into
    # the shared bind mount.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  # ---------------------------------------------------------------------------
  # Queue worker — OTP delivery fan-out, access-event ingestion, webhooks.
  # ---------------------------------------------------------------------------
  queue:
    <<: *app
    environment:
      COMPOSER_HOME: /tmp/composer
      CONTAINER_ROLE: queue
    depends_on:
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Scheduler — offline detection, backup-code expiry, event retention.
  # ---------------------------------------------------------------------------
  scheduler:
    <<: *app
    environment:
      COMPOSER_HOME: /tmp/composer
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Reverb — websocket server backing the dashboard's live event feed.
  # ---------------------------------------------------------------------------
  reverb:
    <<: *app
    ports:
      # REVERB_HOST_PORT is the host binding; REVERB_PORT is what the browser
      # connects to, which differs once Apache fronts the stack. The default is
      # 8081 rather than 8080 because 8080 is a busy port on developer machines
      # — and the fallback has to match .env.example, since a bare clone has no
      # .env for Compose to read.
      - "${REVERB_HOST_PORT:-8081}:8080"
    environment:
      COMPOSER_HOME: /tmp/composer
      CONTAINER_ROLE: reverb
      SKIP_OPTIMIZE: "true"
    depends_on:
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Vite dev server — HMR for the React dashboard. Not used in production.
  # ---------------------------------------------------------------------------
  vite:
    image: node:22-alpine
    # Same uid as the app container, so node_modules/ written into the bind
    # mount stays deletable from the host. Running this as root leaves the
    # developer unable to `rm -rf node_modules`.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # A writable npm home; the default is the root user's.
      npm_config_cache: /tmp/npm
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MySQL — development only. Shared hosting supplies its own (see
  # docker-compose.prod.yml).
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-smart_access}
      MYSQL_USER: ${DB_USERNAME:-smart_access}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mailpit — catches the OTP and invitation e-mails locally.
  # http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  composer-cache:
