; Smart Access Control — PHP-FPM pool.
; Sized for a shared host: modest, bounded worker count.

; No user/group: the container already runs as www-data, and FPM ignores these
; unless the master is root.
[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface worker output in `docker logs` rather than swallowing it.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
