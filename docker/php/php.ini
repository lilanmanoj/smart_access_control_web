; Smart Access Control — PHP runtime tuning.
; Loaded last (zz-*) so it wins over the distribution defaults.

memory_limit = 512M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M
date.timezone = UTC

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Devices batch up to 100 queued access events per request; keep headroom.
max_input_vars = 5000

realpath_cache_size = 4096k
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Overridden to 1 in the dev image so edits are picked up without a restart.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0

session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.use_strict_mode = On
