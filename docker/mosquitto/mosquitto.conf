# Smart Access Control — MQTT doorbell broker (device API 1.4.0).
#
# Mosquitto 2 with the dynamic-security plugin. Panels connect over plain TCP
# on 1883 and may only subscribe to their own sa/v1/dev/<uuid>/notify topic;
# the backend publishes a tiny doorbell there and manages panel logins over
# the plugin's $CONTROL topic from inside the Docker network.
#
# A doorbell carries no data and no authority: every command is still fetched
# and acknowledged over the authenticated HTTPS API. See config/access.php.

per_listener_settings false

listener 1883 0.0.0.0
allow_anonymous false
allow_zero_length_clientid false
set_tcp_nodelay true

# Logins, roles and access rules live here, managed at runtime by the backend
# (php artisan mqtt:bootstrap, then every POST /device-registrations). The file
# is on the mosquitto-data volume and is created on first boot by
# docker/mosquitto/entrypoint.sh.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# A doorbell is never retained; with this off the broker disconnects anything
# that tries to retain a message.
retain_available false

# Panels use clean sessions and the backend only publishes QoS 0, so there is
# nothing worth persisting across a restart. (dynamic-security.json is written
# by the plugin regardless of this setting.)
persistence false
max_queued_messages 10

# Panels send a handful of small packets; the backend's largest is a
# dynamic-security request well under this.
max_packet_size 16384
max_keepalive 300

# One connection per panel, plus the backend's short-lived ones. Raise this
# with the fleet.
max_connections 1000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
# Connection lines are how a stolen panel login shows up: the same client id
# connecting from two places logs "already connected, closing old connection"
# over and over.
connection_messages true
