# Smart Access Control — Apache reverse-proxy vhost for shared hosting.
#
# The host's Apache is the only public entrance. It terminates TLS and forwards
# to the Docker stack, which listens on 127.0.0.1 only.
#
# Install:
#   sudo cp docker/apache/smart-access-control.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo a2ensite smart-access-control
#   sudo systemctl reload apache2
#
# On cPanel-style hosts without site files, paste the <VirtualHost> body into
# the "Include" / custom-configuration box for the domain instead.

<VirtualHost *:80>
    ServerName access.example.com

    # Everything except the ACME challenge goes to HTTPS. Devices talk to this
    # host with a bearer secret in a header; it must never travel in the clear.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName access.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/access.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/access.example.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/smart-access-error.log
    CustomLog ${APACHE_LOG_DIR}/smart-access-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 65

    # Laravel builds absolute URLs and rate-limits per client IP from these.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # -----------------------------------------------------------------------
    # Reverb websockets. These two prefixes must come before the catch-all.
    #   /app/{key}      websocket upgrade (Echo client)
    #   /apps/{id}/...  server-side event publishing API
    # -----------------------------------------------------------------------
    ProxyPass        /app  ws://127.0.0.1:8080/app  upgrade=websocket
    ProxyPassReverse /app  ws://127.0.0.1:8080/app

    ProxyPass        /apps http://127.0.0.1:8080/apps
    ProxyPassReverse /apps http://127.0.0.1:8080/apps

    # -----------------------------------------------------------------------
    # Application. The dashboard SPA, the admin API and the device API all sit
    # behind this single proxy.
    # -----------------------------------------------------------------------
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Devices batch up to 100 access events per request; keep the body limit
    # comfortably above that.
    LimitRequestBody 20971520

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
