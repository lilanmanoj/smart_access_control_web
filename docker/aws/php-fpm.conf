; Smart Access Control — PHP-FPM pool, sized for a 2 GiB instance.
;
; Mounted over /usr/local/etc/php-fpm.d/zz-app.conf on the EC2 deployment.
; It REPLACES docker/php/php-fpm.conf rather than adding to it: php-fpm
; refuses to start if two files declare the same [www] pool.
;
; The default pool allows 20 children. With memory_limit = 512M that is a
; theoretical 10 GB, and on a t4g.small a traffic spike would have the kernel
; OOM-kill MySQL instead. Eight is comfortably more than a few door panels and
; a handful of dashboard operators need.

[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Kill a worker that has genuinely hung rather than letting it hold memory.
; Longer than php.ini's max_execution_time = 60 so PHP reports its own timeout
; first, with a stack trace.
request_terminate_timeout = 120

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
