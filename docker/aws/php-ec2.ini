; Smart Access Control — PHP overrides for the single-instance EC2 deployment.
;
; Mounted at /usr/local/etc/php/conf.d/zzz-ec2.ini, which loads after
; zz-app.ini (docker/php/php.ini) and therefore wins.
;
; Six containers share 2 GiB. Four of them run PHP, and each PHP process group
; maps its own opcache segment, so the image's 192M default reserves 768M of
; address space across the box for a codebase that compiles to well under 64M.

opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000

; The ceiling for one request, not an allocation. Event exports stream, so
; nothing here legitimately needs half a gigabyte.
memory_limit = 256M
